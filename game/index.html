<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Деканат — менеджмент-версия</title>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap"></noscript>
<style>
  :root{
    /* казённый кабинет после отбоя: холодный тёмный фон, бумажный текст, выцветший штамп-синий */
    --bg:#14171c;
    --panel:#1b2028;
    --panel-2:#20262f;
    --border:#2c3340;
    --text:#e8e6df;
    --text-dim:#98a0ab;
    --accent:#5b9dc2;
    --good:#7fa968;
    --warn:#c9a227;
    --bad:#a8434a;
    --hue:0deg;
    --sat:100%;
    --tint-r:96; --tint-g:92; --tint-b:40;
    --tint:0;
    --grain:0;
    --serif:'PT Serif',Georgia,serif;
    --sans:'PT Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:'PT Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:16px;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    filter:hue-rotate(var(--hue)) saturate(var(--sat));
    transition:filter 1.2s ease;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    z-index:-1;
    background-image:linear-gradient(rgba(15,17,21,.72),rgba(15,17,21,.9)),url('assets/dorm.jpg');
    background-size:cover;
    background-position:center 30%;
    background-repeat:no-repeat;
  }
  .app{max-width:1220px;margin:0 auto;position:relative;}
  .bgm-toggle{
    position:fixed;right:16px;bottom:16px;z-index:60;
    width:44px;height:44px;border-radius:50%;
    background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .bgm-toggle.playing{color:var(--accent);border-color:var(--accent);}
  .app::after{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background:linear-gradient(rgba(var(--tint-r),var(--tint-g),var(--tint-b),var(--tint)),rgba(var(--tint-r),var(--tint-g),var(--tint-b),var(--tint)));
    mix-blend-mode:multiply;
    transition:background 1.2s ease;
    z-index:50;
  }
  .app::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:var(--grain);
    background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:3px 3px;
    mix-blend-mode:overlay;
    transition:opacity 1.2s ease;
    z-index:51;
  }
  h1{font-family:var(--serif);font-size:1.5rem;font-weight:700;margin:0 0 2px;letter-spacing:.2px;text-wrap:balance;}
  .subtitle{color:var(--text-dim);font-size:.8rem;margin:0 0 14px;font-family:var(--mono);}
  .status-badge{
    display:inline-block;padding:1px 8px;border-radius:4px;font-size:.68rem;font-weight:700;
    letter-spacing:.4px;text-transform:uppercase;vertical-align:1px;
  }
  .status-badge.ok{background:rgba(127,169,104,.18);color:var(--good);}
  .status-badge.bad{background:rgba(168,67,74,.2);color:var(--bad);}
  .status-badge.neutral{background:rgba(150,160,180,.15);color:var(--text-dim);}
  .topbar{
    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;
  }
  .stat{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;
  }
  .stat-label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;}
  .stat-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:700;margin-top:2px;}
  .bar{height:6px;border-radius:4px;background:#0d0f13;margin-top:6px;overflow:hidden;}
  .bar>i{display:block;height:100%;border-radius:4px;}
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
  @media (max-width:880px){.grid{grid-template-columns:1fr;} .topbar{grid-template-columns:repeat(2,1fr);}}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:14px;
  }
  .panel h2{font-family:var(--serif);font-size:.9rem;margin:0 0 10px;color:var(--text);letter-spacing:.3px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  .panel h2 small{color:var(--text-dim);font-family:var(--sans);font-weight:400;letter-spacing:0;font-size:.72rem;text-transform:uppercase;}
  .slider-row{margin-bottom:12px;}
  .slider-head{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;}
  .slider-head b{font-weight:600;}
  .slider-head span.eff{color:var(--text-dim);font-size:.7rem;font-family:var(--mono);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .budget-line{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.85rem;padding-top:6px;border-top:1px dashed var(--border);margin-top:6px;
  }
  .budget-line b{font-family:var(--mono);}
  .budget-line b.over{color:var(--bad);}
  .sub-options{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap;}
  .scheme-group{margin-bottom:2px;}
  .scheme-group-label{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim);margin:6px 0 2px;}
  .pill{
    border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);
    padding:4px 10px;border-radius:3px;font-size:.72rem;cursor:pointer;user-select:none;
    text-transform:uppercase;letter-spacing:.3px;
  }
  .pill.active{background:var(--accent);color:#0b1520;border-color:var(--accent);font-weight:700;}
  .pill.tag-legal{border-color:#3d5a3d;}
  .pill.tag-gray{border-color:#6b5d2f;}
  .pill.tag-scam{border-color:#6b3030;}
  .pill.tag-criminal{border-color:#6b3030;background:#241417;}
  .forecast-box{
    background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:4px;padding:10px 12px;font-size:.8rem;line-height:1.6;
  }
  .forecast-box .num{font-family:var(--mono);font-weight:700;color:var(--accent);}
  .forecast-box .risk{font-family:var(--mono);color:var(--warn);font-weight:700;}
  .npc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .npc{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;
  }
  .npc.light{opacity:.85;}
  .npc-name{font-size:.78rem;font-weight:600;display:flex;justify-content:space-between;}
  .npc-name span{color:var(--text-dim);font-weight:400;font-family:var(--mono);}
  .npc input[type=range]{margin-top:6px;height:4px;}
  .npc .lock{font-size:.65rem;color:var(--text-dim);margin-top:2px;display:block;font-family:var(--mono);}
  button.confirm{
    width:100%;padding:11px;border-radius:6px;border:none;background:var(--accent);color:#0b1520;
    font-weight:700;font-size:.9rem;cursor:pointer;margin-top:6px;letter-spacing:.2px;
  }
  button.confirm:focus-visible, button.secondary:focus-visible, .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button.confirm:disabled{background:#333b47;color:#767f8c;cursor:not-allowed;}
  button.secondary{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    padding:9px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;
  }
  button.secondary:disabled{opacity:.45;cursor:not-allowed;}
  .report{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    padding:12px 14px;font-size:.83rem;line-height:1.6;white-space:pre-line;font-family:var(--mono);
  }
  .report .rep-title{font-family:var(--serif);font-size:.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 2px;}
  .report .rep-title:first-child{margin-top:0;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--warn);
    border-radius:8px;max-width:480px;width:100%;padding:20px;max-height:90vh;overflow-y:auto;
  }
  .modal.event-turn{border-top-color:var(--accent);}
  .modal h3{font-family:var(--serif);margin:0 0 4px;font-size:1.1rem;}
  .modal .kicker{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:8px;}
  .modal p{font-size:.86rem;line-height:1.55;color:var(--text-dim);white-space:pre-line;}
  .modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .modal .choices button{width:100%;text-align:left;}
  .endscreen{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center;
  }
  .endscreen h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:8px;}
  .endscreen p{color:var(--text-dim);font-size:.9rem;line-height:1.6;white-space:pre-line;text-align:left;max-width:560px;margin:12px auto;font-family:var(--serif);}
  .tier-note{font-size:.72rem;color:var(--warn);margin-top:4px;}
  .warn-inline{color:var(--bad);font-size:.75rem;margin-top:6px;}
  footer{text-align:center;color:var(--text-dim);font-size:.7rem;margin-top:20px;font-family:var(--mono);}
  .restore-box{background:var(--panel-2);border:1px solid var(--bad);border-left:3px solid var(--bad);border-radius:4px;padding:12px;margin-bottom:14px;font-size:.82rem;}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
  .shop-item{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:.78rem;display:flex;flex-direction:column;gap:6px;}
  .shop-item .name{font-weight:700;font-size:.8rem;}
  .shop-item .price{font-family:var(--mono);color:var(--accent);}
  .shop-item .cat{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim);}
  .shop-item .eff{color:var(--text-dim);font-size:.72rem;}
  .shop-item.owned{border-color:var(--good);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<audio id="bgm" src="assets/track.mp3" loop preload="none"></audio>
<button class="bgm-toggle" id="bgm-toggle" onclick="toggleMusic()" aria-label="Включить/выключить музыку" title="Криминальный бит — Рассвет">♪</button>

<script>
/* ============ КОНСТАНТЫ ============ */
const MAX_WEEKS = 45;
const BASE_BUDGET = 21;
// единая кривая убывающей отдачи: 1-3 юнита - 100%, 4-5 - 70%, 6-7 - 40%, 8+ - 20%
function unitRate(index){ // index = номер юнита, начиная с 1
  if(index<=3) return 1;
  if(index<=5) return 0.7;
  if(index<=7) return 0.4;
  return 0.2;
}
function effectiveUnits(n){
  if(n<=0) return 0;
  let sum=0;
  for(let i=1;i<=n;i++) sum += unitRate(i);
  return sum;
}
const FULL_NODES = ['director','zemlekop','upp','vlados'];
const LIGHT_NODES = ['arkadiy','kondratyuk'];
const NPC_LABELS = {
  director:'Директор института', zemlekop:'Землекоп', upp:'Комиссия УПП', vlados:'Владос',
  arkadiy:'Отец Аркадий', kondratyuk:'Кондратюк'
};
const NPC_SUBLABEL = {
  director:'администрация', zemlekop:'земельное право', upp:'Кузнецов/Комаров', vlados:'сосед по общаге',
  arkadiy:'малозначимая линия', kondratyuk:'светлая линия'
};
const TAILS_CRISIS_THRESHOLD = 50;

function escalationTier(esc){
  if(esc<26) return 1;
  if(esc<=50) return 2;
  if(esc<=75) return 3;
  return 4;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function roundMoney(v){ return Math.round(v/500)*500; }
function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
function priceMult(escalation){ return 1 + 0.15*Math.floor(escalation/25); }

/* ============ ИМЕННЫЕ СХЕМЫ ЗАРАБОТКА ============ */
// диапазоны заданы "на типичное вложение" (~4 юнита, эфф.≈3.7) и масштабируются юнитами
const TYPICAL_EFF = 3.7;
const SCHEMES = {
  doc_translation:{ label:'Перевод документов (Сергей_ИП84)', cat:'legal', low:3000, high:10000, fail:0.08,
    onFail:(lines)=>{ lines.push('Перевод документов: заказчик передумал — ушёл вечер, денег нет.'); } },
  tutoring:{ label:'Репетиторство', cat:'legal', low:4000, high:12000, fail:0.10,
    onFail:(lines)=>{ lines.push('Репетиторство: ученик заболел, занятие сорвалось.'); } },
  copywriting:{ label:'Копирайтинг для юрфирмы', cat:'legal', low:5000, high:15000, fail:0.12,
    onFail:(lines)=>{ lines.push('Копирайтинг: текст завернули на правки, в срок не уложились — оплаты нет.'); },
    onSuccess:(lines)=>{ if(Math.random()<0.3){ S.trust.director=clamp(S.trust.director+3,0,100); lines.push('Фирма — партнёр института: хорошая работа долетела до администрации, доверие директора +3.'); } } },
  courier:{ label:'Подработка курьером', cat:'legal', low:2000, high:6000, fail:0.05,
    onFail:(lines)=>{ lines.push('Курьером: заказ отменили на середине маршрута.'); },
    onSuccess:(lines)=>{ S.resources.stress=clamp(S.resources.stress+2,0,100); lines.push('Курьером: набегался — стресс +2 сверху, но деньги живые.'); } },
  fake_certs:{ label:'Липовые справки об успеваемости', cat:'gray', low:15000, high:50000, fail:0.30,
    onFail:(lines)=>{ S.trust.director=clamp(S.trust.director-12,0,100); S.resources.tails=clamp(S.resources.tails+10,0,100);
      lines.push('Справки: подделку заметили — доверие директора −12, хвосты +10.'); } },
  dropshipping:{ label:'Дропшиппинг', cat:'gray', low:10000, high:40000, fail:0.35,
    onFail:(lines,scale)=>{ const lost=Math.round(roundMoney(10000*scale*0.4)); S.resources.money=Math.max(0,S.resources.money-lost);
      lines.push(`Дропшиппинг: поставщик пропал вместе с предоплатой — минус ${fmt(lost)}₽.`); } },
  leaked_tests:{ label:'Слив тестов УПП/земельного права', cat:'gray', low:8000, high:30000, fail:0.28,
    onFail:(lines)=>{ const who = Math.random()<0.5 ? 'zemlekop':'upp'; const label = who==='zemlekop'?'Землекопа':'комиссии УПП';
      S.trust[who]=clamp(S.trust[who]-10,0,100); S.resources.tails=clamp(S.resources.tails+6,0,100);
      lines.push(`Слив тестов: спалились перед ${label} — доверие −10, хвосты +6.`); } },
  crypto:{ label:'Крипто-биржа от знакомого', cat:'gray', low:20000, high:100000, fail:0.45,
    onFail:(lines,scale)=>{ const lost=Math.round(roundMoney(20000*scale*0.5)); S.resources.money=Math.max(0,S.resources.money-lost);
      lines.push(`Крипто-биржа: график ушёл не в ту сторону — минус ${fmt(lost)}₽ вложенного.`); } },
  investclub:{ label:'Инвестклуб', cat:'scam', low:50000, high:400000, fail:0.80,
    onFail:(lines,scale)=>{ const lost=Math.round(roundMoney(50000*scale*0.6)); S.resources.money=Math.max(0,S.resources.money-lost);
      S.resources.stress=clamp(S.resources.stress+18,0,100);
      lines.push(`Инвестклуб: пирамида схлопнулась — минус ${fmt(lost)}₽, стресс +18.`); } },
  nft_pump:{ label:'NFT «гарантированный памп»', cat:'scam', low:45000, high:380000, fail:0.80,
    onFail:(lines,scale)=>{ const lost=Math.round(roundMoney(45000*scale*0.6)); S.resources.money=Math.max(0,S.resources.money-lost);
      S.resources.stress=clamp(S.resources.stress+16,0,100);
      lines.push(`NFT: «памп» оказался сливом ликвидности — минус ${fmt(lost)}₽, стресс +16.`); } },
  vlados_match:{ label:'Договорной матч (связи Владоса)', cat:'scam', low:60000, high:250000, fail:0.45,
    onFail:(lines,scale)=>{ const lost=Math.round(roundMoney(30000*scale*0.4)); S.resources.money=Math.max(0,S.resources.money-lost);
      S.resources.stress=clamp(S.resources.stress+10,0,100);
      lines.push(`Договорной матч: не срослось — минус ${fmt(lost)}₽, стресс +10.`); },
    criminal:12 },
  vlados_deal:{ label:'Дело с Владосом', cat:'criminal', low:50000, high:250000, fail:0.30,
    onFail:(lines)=>{ S.resources.stress=clamp(S.resources.stress+10,0,100); lines.push('Дело с Владосом: сорвалось в последний момент — стресс +10, ничего не заработано.'); },
    onSuccess:(lines)=>{ S.trust.vlados=clamp(S.trust.vlados+6,0,100); lines.push('Дело с Владосом: сделано чисто, он это ценит — доверие Владоса +6.'); },
    criminal:15 }
};
const LEGAL_IDS = ['doc_translation','tutoring','copywriting','courier'];
const GRAY_IDS = ['fake_certs','dropshipping','leaked_tests','crypto'];
const SCAM_IDS = ['investclub','nft_pump','vlados_match'];

function sample(arr, n){
  const copy = arr.slice(); const out=[];
  while(out.length<n && copy.length){ out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  return out;
}
function rotateMarket(){
  S.market = {
    legal: sample(LEGAL_IDS, 3),
    gray: sample(GRAY_IDS, 2),
    scam: SCAM_IDS.filter(()=> Math.random() < 0.12 + 0.08*escalationTier(S.resources.escalation))
  };
  const avail = availableSchemeIds();
  if(!avail.includes(S.incomeScheme)) S.incomeScheme = avail[0] || null;
}
function availableSchemeIds(){
  const ids = [...S.market.legal, ...S.market.gray, ...S.market.scam];
  if(S.vladosUnlocked) ids.push('vlados_deal');
  return ids;
}
function schemeParams(id, units, tier){
  const s = SCHEMES[id];
  const eff = effectiveUnits(units);
  const scale = eff/TYPICAL_EFF;
  let low = s.low*scale, high = s.high*scale;
  let fail = s.fail;
  if(s.cat==='legal' && tier>=2){
    let mult = tier===2?0.7: tier===3?0.55:0.4;
    low*=mult; high*=mult;
  }
  if(s.cat!=='legal') fail = clamp(fail + 0.015*(tier-1), 0, 0.9);
  return { low, high, fail, scale };
}

/* ============ ВИТРИНА ДОРОГИХ ПОКУПОК ============ */
const SHOP_ITEMS = {
  sneakers:{ label:'Крутые кроссовки', price:20000, cat:'flex', stress:8, weeks:4 },
  dinner:{ label:'Дорогой ужин «для сторис»', price:8000, cat:'flex', stress:6, weeks:2 },
  donate:{ label:'Донат стримеру напоказ', price:6000, cat:'flex', stress:5, weeks:1 },
  rostov:{ label:'Поездка в Ростов', price:6000, cat:'flex', stress:8, weeks:3 },
  konspekt:{ label:'Конспект по земельному праву', price:5000, cat:'flex', stress:3, weeks:0, studyHelp:true },
  chain:{ label:'Золотая цепочка', price:40000, cat:'status', stress:15, weeks:9, premium:false },
  gucci:{ label:'Gucci (худи/кроссовки)', price:55000, cat:'status', stress:15, weeks:9 },
  iphone:{ label:'iPhone последней модели', price:90000, cat:'status', stress:20, weeks:11 },
  tsum:{ label:'Поездка в ЦУМ', price:15000, cat:'status', stress:10, weeks:3 },
  watch:{ label:'Швейцарские часы (топ-реплика)', price:180000, cat:'premium', stress:25, weeks:16 },
  tattoo:{ label:'Тату у известного мастера', price:60000, cat:'premium', stress:12, weeks:0 },
  laptop:{ label:'Топовый ноутбук', price:150000, cat:'premium', stress:18, weeks:12, incomeBoost:true },
  abroad:{ label:'Отпуск за границу (не Таиланд)', price:220000, cat:'premium', stress:30, weeks:6, residualStress:10 },
  car:{ label:'Автомобиль (подержанная иномарка)', price:350000, cat:'structural', upkeep:5000, structuralEffect:'stress' },
  apartment:{ label:'Съёмная квартира', price:30000, cat:'structural', upkeep:6250, structuralEffect:'life' }
};

function budgetFor(){ return BASE_BUDGET; }

function allocSum(a){ return a.study+a.income+a.life+a.relations+a.relief; }

/* ============ ХОД РАСПРЕДЕЛЕНИЯ (недельная математика) ============ */
function resolveAllocTurn(){
  const a = S.allocation;
  const tier = escalationTier(S.resources.escalation);
  const lines = { money:[], stress:[], food:[], tails:[], trust:[], flags:[] };

  // Учёба -> хвосты. Программа тяжелеет к концу семестра — фиксированная раскладка юнитов
  // со временем перестаёт справляться, нужно наращивать вложение.
  const weekFrac = clamp(S.week/MAX_WEEKS, 0, 1);
  const effStudy = effectiveUnits(a.study);
  let tailsDelta = Math.round((7 + 5*weekFrac) - 3.3*effStudy);
  if(S.shop.konspekt) tailsDelta -= 1;
  const tailsBefore = S.resources.tails;
  S.resources.tails = clamp(S.resources.tails + tailsDelta, 0, 100);
  lines.tails.push(`${tailsBefore}→${S.resources.tails} (юниты учёбы: ${a.study}${S.shop.konspekt?', конспект −1':''})`);

  // Заработок — именная схема
  let moneyTotal = 0;
  if(a.income>0 && S.incomeScheme && SCHEMES[S.incomeScheme]){
    const s = SCHEMES[S.incomeScheme];
    const p = schemeParams(S.incomeScheme, a.income, tier);
    const failed = Math.random() < p.fail;
    if(failed){
      s.onFail(lines.money, p.scale);
    } else {
      const gain = Math.round(roundMoney(rnd(p.low,p.high)));
      moneyTotal += gain;
      lines.money.push(`${s.label}: +${fmt(gain)}₽`);
      if(s.onSuccess) s.onSuccess(lines.money);
    }
    if(s.criminal){
      S.resources.criminalRisk = clamp(S.resources.criminalRisk + s.criminal, 0, 100);
      lines.flags.push(`Уголовный риск незаметно подрос (дело с Владосом).`);
    }
  }
  S.resources.money = Math.max(0, S.resources.money + moneyTotal);

  // Быт -> покупка еды (деньги) + сытость
  const effLife = effectiveUnits(a.life);
  const lifeQuality = clamp(effLife/3.7, 0, 1); // 0..1, насколько эффективно тратит время на быт
  const foodCost = Math.round((3000 - 1500*lifeQuality) * priceMult(S.resources.escalation));
  const targetGain = 26;
  const decay = Math.round(rnd(8,14) + 3*weekFrac);
  const affordable = Math.min(foodCost, S.resources.money);
  const spendRatio = foodCost>0 ? affordable/foodCost : 0;
  const foodGain = Math.round(targetGain*spendRatio);
  S.resources.money = Math.max(0, S.resources.money - affordable);
  const foodBefore = S.resources.food;
  S.resources.food = clamp(S.resources.food - decay + foodGain, 0, 100);
  lines.food.push(`${foodBefore}→${S.resources.food} (расход −${decay}, закупка +${foodGain} за ${fmt(affordable)}₽)`);
  if(affordable<foodCost) lines.flags.push(`Не хватило денег на полноценную еду — нужно было ${fmt(foodCost)}₽, потрачено ${fmt(affordable)}₽.`);

  // Аренда общаги — периодический флейвор-платёж (не узел доверия)
  if(S.week>=S.rentDueWeek){
    const rent = Math.round(rnd(4000,6000)*priceMult(S.resources.escalation));
    if(S.resources.money>=rent){
      S.resources.money -= rent;
      lines.money.push(`Оплата общежития: −${fmt(rent)}₽`);
    } else {
      S.resources.stress = clamp(S.resources.stress+10,0,100);
      lines.flags.push('Не хватило денег на общагу — комендантша грозится штрафом, стресс +10.');
    }
    S.rentDueWeek += 4;
  }

  // Структурные покупки — recurring содержание
  if(S.shop.car){ S.resources.money = Math.max(0,S.resources.money-5000); lines.money.push('Содержание машины: −5 000₽'); }
  if(S.shop.apartment){ S.resources.money = Math.max(0,S.resources.money-6250); lines.money.push('Аренда квартиры: −6 250₽'); }

  // Разгрузка -> стресс. Базовая усталость растёт по ходу семестра, а разгрузка со временем
  // (и с ростом эскалации) даёт всё меньшую отдачу — одного юнита надолго не хватит.
  const effRelief = effectiveUnits(a.relief);
  const stressBase = Math.round(6 + 6*weekFrac);
  const reliefMult = 1 - 0.05*(tier-1);
  const reliefEffect = Math.round(effRelief*3.2*reliefMult);
  let stressChange = stressBase - reliefEffect;
  const parts = [`база +${stressBase}`, `разгрузка −${reliefEffect}`];
  if(S.resources.food===0){ stressChange += 12; parts.push('голод +12'); }
  if(tier===3){ stressChange += 3; parts.push('эскалация +3'); }
  if(tier===4){ stressChange += 6; parts.push('эскалация +6'); }
  if(S.shop.car){ stressChange -= 3; parts.push('машина −3'); }
  if(S.shop.apartment){ stressChange -= 3; parts.push('квартира −3'); }
  const stressBefore = S.resources.stress;
  S.resources.stress = clamp(S.resources.stress + stressChange, 0, 100);
  lines.stress.push(`${stressBefore}→${S.resources.stress} (${parts.join(', ')})`);

  // Отношения — дрейф и адресная подпитка
  Object.keys(NPC_LABELS).forEach(k=>{
    const units = S.relationSplit[k]||0;
    const isFull = FULL_NODES.includes(k);
    if(units>0){
      const gain = Math.round(8*effectiveUnits(units));
      S.trust[k] = clamp(S.trust[k]+gain,0,100);
      lines.trust.push(`${NPC_LABELS[k]}: +${gain} (вложено ${units})`);
    } else {
      const drift = isFull ? -4 : -1;
      if(k==='director' && S.directorEra==='vasilina') { S.trust[k]=clamp(S.trust[k]-6,0,100); lines.trust.push(`${NPC_LABELS[k]}: −6 (дрейф эпохи Василины)`); }
      else { S.trust[k] = clamp(S.trust[k]+drift,0,100); lines.trust.push(`${NPC_LABELS[k]}: ${drift} (без подпитки)`); }
    }
  });
  maybeKondratyukNarrative(lines.flags);
  maybeCriminalNarrative(lines.flags);

  // Эскалация
  S.resources.escalation = clamp(S.resources.escalation + 1 + Math.round(rnd(0,0.6)), 0, 100);

  // Кризисные счётчики
  S.crisisCounters.tails = S.resources.tails>=TAILS_CRISIS_THRESHOLD ? S.crisisCounters.tails+1 : 0;
  S.crisisCounters.food = S.resources.food===0 ? S.crisisCounters.food+1 : 0;

  // Жёсткие концовки, проверяемые сразу
  if(S.resources.stress>=100){
    endGame('over','Суицид', S.shop.konspekt
      ? 'Стресс дошёл до предела. На столе — тот самый конспект по земельному праву, аккуратно исписанный. Даже это не помогло удержаться.'
      : 'Стресс дошёл до предела. Никто не успел заметить, что с Данилом давно что-то не так.');
    S.log.unshift({ week:S.week, phase:'alloc', lines });
    return;
  }
  if(S.crisisCounters.food>=2){
    endGame('over','Смерть от голода','Вторая неделя подряд без денег на нормальную еду. Организм не выдержал.');
    S.log.unshift({ week:S.week, phase:'alloc', lines });
    return;
  }

  S.log.unshift({ week:S.week, phase:'alloc', lines });
  if(S.log.length>40) S.log.pop();

  S.turnPhase = 'event';
  S.pendingEventTurn = buildEventTurn();
}

function maybeKondratyukNarrative(flagLines){
  const k = S.trust.kondratyuk;
  if(k<=60 && !S.firedEvents.kond60){ S.firedEvents.kond60=true; flagLines.push('Фон: Кондратюк выглядит подавленным — баланс явно не сходится, но он ещё шутит про это.'); }
  if(k<=35 && !S.firedEvents.kond35){ S.firedEvents.kond35=true; flagLines.push('Фон: Кондратюк почти не появляется — судя по всему, дела совсем плохи.'); }
  if(k<=10 && !S.firedEvents.kond10){ S.firedEvents.kond10=true; flagLines.push('Фон: Кондратюк пропал на несколько дней.'); }
}
function maybeCriminalNarrative(flagLines){
  const r = S.resources.criminalRisk;
  if(r>=40 && !S.firedEvents.crim40){ S.firedEvents.crim40=true; flagLines.push('Фон: кто-то из знакомых Владоса лишний раз спрашивал про Данила — возможно, просто любопытство.'); }
  if(r>=70 && !S.firedEvents.crim70){ S.firedEvents.crim70=true; flagLines.push('Фон: в последнее время слишком много посторонних глаз вокруг.'); }
}

/* ============ ХОД СОБЫТИЯ ============ */
function buildEventTurn(){
  const w = S.week;

  // жёсткая концовка по хвостам может уже наступить прямо сейчас
  if(S.crisisCounters.tails>=2){
    S.crisisCounters.tails=0;
    return buildCommissionEvent();
  }

  const fixed = FIXED_EVENTS[w];
  if(fixed && !S.firedEvents['fixed'+w]){
    S.firedEvents['fixed'+w] = true;
    return fixed();
  }

  if(S.kryakovtsevPromise && S.kryakovtsevPromise.resolveWeek===w){
    const promise = S.kryakovtsevPromise; S.kryakovtsevPromise = null;
    S.resources.tails = clamp(S.resources.tails-15,0,100);
    return { title:'Кряковцев сдержал слово', kicker:'Директор института', text:'Как и обещал, Кряковцев тихо закрыл часть хвостов через деканат — не быстро, но по-человечески.', choices:[{label:'Хорошо, что так', effect:()=>{}}] };
  }

  if(w>=20 && S.resources.criminalRisk>0 && !(S.criminalFrozenUntil>=w)){
    const chance = S.resources.criminalRisk/400;
    if(Math.random()<chance) return buildPoliceEvent();
  }

  const pool = randomEventPool();
  const recent = S.log.slice(0,4).map(l=>l.eventId).filter(Boolean);
  const filtered = pool.filter(e=>!recent.includes(e.id));
  const chosen = pick(filtered.length?filtered:pool);
  const built = chosen.build();
  built._id = chosen.id;
  return built;
}

function buildCommissionEvent(){
  if(S.directorEra==='lazor'){
    const cost = Math.round(rnd(15000,35000) * (0.5 + S.resources.tails/100));
    return { title:'Вызов на комиссию', kicker:'Эпоха Лазор — вопрос решают деньги', text:`Хвосты накопились. При Лазор всё решается напрямую: занести ${fmt(cost)}₽ секретарю — и вопрос снят без комиссии.`, choices:[
      { label:`Занести ${fmt(cost)}₽`, effect:()=>{
          if(S.resources.money>=cost){ S.resources.money-=cost; S.resources.tails=clamp(S.resources.tails-25,0,100); }
          else { S.studentStatus=false; }
        } },
      { label:'Отказаться / нечем платить', effect:()=>{ S.studentStatus=false; } }
    ]};
  }
  const subject = Math.random()<0.5 ? 'zemlekop' : 'upp';
  const bank = subject==='zemlekop' ? QUIZ_ZEMLEKOP : QUIZ_UPP;
  const qi = Math.floor(Math.random()*bank.length);
  const question = bank[qi];
  const label = subject==='zemlekop' ? 'Землекоп (земельное право)' : 'Комиссия УПП (Кузнецов/Комаров)';
  const choices = question.options.map((opt,i)=>({
    label: opt,
    effect: ()=>{
      const isCorrect = i===question.correct;
      const trusted = S.trust[subject]>=30;
      if(isCorrect && trusted){ S.resources.tails=clamp(S.resources.tails-25,0,100); }
      else { S.studentStatus = false; }
    }
  }));
  if(S.directorEra==='kryakovtsev' && S.trust.director>=50){
    choices.push({ label:'Попросить директора «разобраться по-человечески» (20 000₽)', effect:()=>{
      if(S.resources.money>=20000){
        S.resources.money-=20000; S.resources.tails=clamp(S.resources.tails-15,0,100);
        S.kryakovtsevPromise = { resolveWeek: Math.min(MAX_WEEKS, S.week+3) };
      } else { S.studentStatus=false; }
    }});
  }
  return { title:'Вызов на комиссию', kicker:label, text:`Хвосты накопились настолько, что вызывают на комиссию. Формально верный ответ засчитают только при достаточном доверии — иначе сочтут угаданным.\n\nВопрос: ${question.q}`, choices };
}

function buildPoliceEvent(){
  if(!S.criminalWarned){
    S.criminalWarned = true;
    S.criminalFrozenUntil = S.week+2;
    const fine = Math.round(rnd(10000,40000));
    return { title:'Интерес со стороны правоохранителей', kicker:'Предупреждение', text:`Вопросы задали — пока не всерьёз, но неприятно. Штраф ${fmt(fine)}₽, и на пару недель лучше залечь на дно.`, choices:[
      { label:'Понятно', effect:()=>{ S.resources.money=Math.max(0,S.resources.money-fine); S.resources.stress=clamp(S.resources.stress+12,0,100); } }
    ]};
  }
  if(S.resources.criminalRisk>70){
    return { title:'Задержание', kicker:'', text:'На этот раз всерьёз — уголовное дело. Дальше уже не до диплома.', choices:[
      { label:'...', effect:()=>{ endGame('over','Арест','Уголовное дело закрывает партию — независимо от денег на счету и оценок в зачётке.'); } }
    ]};
  }
  return { title:'Ложная тревога', kicker:'', text:'Проверка «для профилактики» — на этот раз мимо. Но осадок остался.', choices:[
    { label:'Выдохнуть', effect:()=>{ S.resources.stress=clamp(S.resources.stress+6,0,100); S.trust.director=clamp(S.trust.director-4,0,100); } }
  ]};
}

/* ============ ЗАВЕРШЕНИЕ ИГРЫ ============ */
function endGame(kind, title, text){
  S.gameOver = { kind, title, text };
  clearSave();
}
function finishGame(){
  if(!S.studentStatus){
    endGame('over','Мобилизация','Отчислен и не восстановлен на момент финальной проверки — бронь не действует. Дальше решают документы, не оценки.');
    return;
  }
  if(S.resources.money>=10000000){
    endGame('win','Таиланд','Деньги на счету, диплом на руках. Наконец можно позволить себе ту самую поездку, о которой шутили весь институт.');
    return;
  }
  endGame('neutral','Открытый финал','Неделя 45. Студент, деньги — так себе. Ничего не взорвалось, ничего не изменилось — просто ещё один человек, который доучился.');
}

/* ============ СОХРАНЕНИЕ ============ */
const SAVE_KEY = 'dekanat_save_v2';
function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadGame(){ try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function saveIfOngoing(){ if(!S.gameOver) saveGame(); }

/* ============ ДЕЙСТВИЯ UI ============ */
function setAlloc(key, val){
  S.allocation[key] = clamp(parseInt(val)||0, 0, 21);
  if(key==='relations'){
    const cap = S.allocation.relations;
    let sum = Object.values(S.relationSplit).reduce((a,b)=>a+b,0);
    if(sum>cap){
      let excess = sum-cap;
      for(const k of Object.keys(S.relationSplit)){
        if(excess<=0) break;
        const cut = Math.min(S.relationSplit[k], excess);
        S.relationSplit[k]-=cut; excess-=cut;
      }
    }
  }
  render();
}
function setRelation(npc, val){
  const v = clamp(parseInt(val)||0,0,21);
  const others = Object.keys(S.relationSplit).filter(k=>k!==npc).reduce((a,k)=>a+S.relationSplit[k],0);
  const cap = S.allocation.relations;
  S.relationSplit[npc] = Math.min(v, Math.max(0, cap-others));
  render();
}
function setScheme(id){ S.incomeScheme = id; render(); }
function validAllocation(){
  const sum = allocSum(S.allocation);
  if(sum>budgetFor()) return false;
  if(S.allocation.relations !== Object.values(S.relationSplit).reduce((a,b)=>a+b,0)) return false;
  if(S.allocation.life < minLifeFor()) return false;
  return true;
}
function confirmAllocTurn(){
  if(!validAllocation()) return;
  if((S.week-1)%5===0) rotateMarket();
  resolveAllocTurn();
  if(!S.gameOver){ S.modal = S.pendingEventTurn; S.pendingEventTurn = null; }
  saveIfOngoing();
  render();
}
function handleEventChoice(i){
  const m = S.modal;
  if(m && m.choices[i] && m.choices[i].effect) m.choices[i].effect();
  if(S.log[0] && S.log[0].phase==='alloc') S.log[0].eventId = m._id;
  S.modal = null;
  if(!S.gameOver){
    S.week += 1;
    if(S.week>MAX_WEEKS){ finishGame(); }
    else { S.turnPhase = 'alloc'; }
  }
  saveIfOngoing();
  render();
}
function tryRestore(){
  const cost = restoreCost();
  if(S.resources.money>=cost){
    S.resources.money -= cost;
    S.studentStatus = true;
    S.resources.tails = 50;
    S.restorations += 1;
    saveIfOngoing();
    render();
  }
}
function restoreCost(){
  const tier = escalationTier(S.resources.escalation);
  let base = 150000 * Math.pow(1.8, S.restorations);
  if(tier===3) base *= 1.5;
  if(tier===4) base *= 2.2;
  base *= (1 - 0.3*(S.trust.director/100));
  return Math.round(base/1000)*1000;
}
function buyItem(id){
  const item = SHOP_ITEMS[id];
  const price = currentPrice(id);
  if(S.resources.money<price || S.shop[id]) return;
  S.resources.money -= price;
  S.shop[id] = { boughtWeek:S.week, paid:price };
  if(item.cat==='premium'){
    const premiumCount = Object.keys(S.shop).filter(k=>SHOP_ITEMS[k] && SHOP_ITEMS[k].cat==='premium').length;
    if(premiumCount>1) S.resources.criminalRisk = clamp(S.resources.criminalRisk+3,0,100);
  }
  if(item.stress){
    const dec = decayFactor();
    S.resources.stress = clamp(S.resources.stress - Math.round(item.stress*dec), 0, 100);
  }
  saveIfOngoing();
  render();
}
function sellItem(id){
  const item = SHOP_ITEMS[id];
  const owned = S.shop[id];
  if(!owned) return;
  const frac = item.cat==='status' ? 0.5 : 0.4;
  const refund = Math.round(owned.paid*frac/500)*500;
  S.resources.money += refund;
  delete S.shop[id];
  saveIfOngoing();
  render();
}
function restartGame(){ clearSave(); S = freshState(); render(); }
function startGame(){ clearSave(); S = freshState(); S.started = true; saveGame(); render(); startMusic(); }
function continueGame(){
  const saved = loadGame();
  if(saved){ S = saved; S.started = true; render(); }
  else startGame();
  startMusic();
}

/* ============ ВИЗУАЛЬНАЯ ДЕГРАДАЦИЯ ============ */
function applyVisualTier(){
  const tier = escalationTier(S.resources.escalation);
  const root = document.documentElement;
  const map = {
    1:{ hue:'0deg',  sat:'100%', tint:0    , grain:0    },
    2:{ hue:'14deg', sat:'88%',  tint:0.03 , grain:0.02 },
    3:{ hue:'26deg', sat:'70%',  tint:0.07 , grain:0.05 },
    4:{ hue:'40deg', sat:'52%',  tint:0.13 , grain:0.09 }
  };
  const t = map[tier];
  root.style.setProperty('--hue',t.hue);
  root.style.setProperty('--sat',t.sat);
  root.style.setProperty('--tint',t.tint);
  root.style.setProperty('--grain',t.grain);
}

/* ============ РЕНДЕР ============ */
function barColor(value, invert){
  const good = invert ? value<40 : value>60;
  const mid = invert ? value<70 : value>30;
  if(good) return 'var(--good)';
  if(mid) return 'var(--warn)';
  return 'var(--bad)';
}

    app.innerHTML = `
      <h1>Деканат — менеджмент-версия</h1>
      <p class="subtitle">Ход ${turnNumber}/90 · Неделя ${S.week}/${MAX_WEEKS} · Ход события · Директор института: ${S.directorName}</p>
      <div class="topbar">
        ${statCard('Деньги', fmt(r.money)+'₽', Math.min(100,r.money/100000), false)}
        ${statCard('Стресс', r.stress, r.stress, true)}
        ${statCard('Шаурма', r.food, r.food, false)}
        ${statCard('Хвосты', r.tails, r.tails, true)}
        ${statCard('Эскалация', r.escalation+' (ур.'+tier+')', r.escalation, true)}
      </div>
      ${modalHtml(S.modal, true)}
      <footer>Данил · Юридический институт при Дале · общага №3</footer>
    `;
    return;
  }

  const sum = allocSum(S.allocation);
  const budget = budgetFor();
  const remaining = budget - sum;
  const valid = validAllocation();
  const relSum = Object.values(S.relationSplit).reduce((a,b)=>a+b,0);
  const forecast = (S.allocation.income>0 && S.incomeScheme) ? schemeParams(S.incomeScheme, S.allocation.income, tier) : null;

  app.innerHTML = `
    <h1>Деканат — менеджмент-версия</h1>
    <p class="subtitle">Ход ${turnNumber}/90 · Неделя ${S.week}/${MAX_WEEKS} · Ход распределения · Директор института: ${S.directorName} · <span class="status-badge ${S.studentStatus?'ok':'bad'}">${S.studentStatus?'Студент':'Отчислен'}</span></p>

    <div class="topbar">
      ${statCard('Деньги', fmt(r.money)+'₽', Math.min(100,r.money/100000), false)}
      ${statCard('Стресс', r.stress, r.stress, true)}
      ${statCard('Шаурма', r.food, r.food, false)}
      ${statCard('Хвосты', r.tails, r.tails, true)}
      ${statCard('Эскалация', r.escalation+' (ур.'+tier+')', r.escalation, true)}
    </div>

    ${!S.studentStatus ? `
      <div class="restore-box">
        <b>Данил отчислен.</b> Восстановление стоит ${fmt(restoreCost())}₽ (растёт с каждым разом, с эскалацией, дешевле при высоком доверии директора).
        <div style="margin-top:8px;"><button class="secondary" ${r.money<restoreCost()?'disabled':''} onclick="tryRestore()">Восстановиться (${fmt(restoreCost())}₽)</button></div>
      </div>
    ` : ''}

    <div class="grid">
      <div>
        <div class="panel">
          <h2>Распределение юнитов <small>осталось: ${remaining}/${budget}</small></h2>
          ${sliderRow('study','Учёба', S.allocation.study)}
          ${sliderRow('income','Заработок', S.allocation.income)}
          ${schemeGroups()}
          ${sliderRow('life','Быт', S.allocation.life)}
          ${minLifeFor()>0 && S.allocation.life<minLifeFor() ? `<div class="warn-inline">Высокая эскалация требует минимум ${minLifeFor()} юнита на быт.</div>` : ''}
          ${sliderRow('relations','Отношения', S.allocation.relations)}
          ${sliderRow('relief','Разгрузка', S.allocation.relief)}
          <div class="budget-line">
            <span>Юнитов распределено:</span>
            <b class="${sum>budget?'over':''}">${sum} / ${budget}</b>
          </div>
          ${S.allocation.relations !== relSum ? `<div class="warn-inline">Распредели все юниты «Отношений» между конкретными людьми ниже (${relSum}/${S.allocation.relations}).</div>` : ''}
          <button class="confirm" ${valid?'':'disabled'} onclick="confirmAllocTurn()">Подтвердить ход распределения</button>
        </div>

        <div class="panel">
          <h2>Отношения <small>дрейф без подпитки: полные узлы −4/нед, лёгкие −1/нед</small></h2>
          <div class="npc-grid">
            ${Object.keys(NPC_LABELS).map(k=>npcCard(k)).join('')}
          </div>
        </div>

        <div class="panel">
          <h2>Витрина <small>доступна в любой момент, за деньги, не за юниты</small></h2>
          <div class="shop-grid">
            ${Object.keys(SHOP_ITEMS).map(id=>shopItemCard(id)).join('')}
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>Прогноз риска</h2>
          ${forecast ? `
            <div class="forecast-box">
              ${SCHEMES[S.incomeScheme].label}, ${S.allocation.income} юнита вложено →<br>
              прогноз: <span class="num">${fmt(forecast.low)}–${fmt(forecast.high)}₽</span><br>
              риск провала: <span class="risk">~${Math.round(forecast.fail*100)}%</span>
              ${SCHEMES[S.incomeScheme].cat==='legal' && tier>=2 ? `<div class="tier-note">Легальный рынок просел из-за эскалации.</div>`:''}
              ${SCHEMES[S.incomeScheme].criminal ? `<div class="tier-note">Участие повышает уголовный риск независимо от исхода.</div>`:''}
            </div>
          ` : `<div class="forecast-box">Юниты в «Заработок» не вложены или схема не выбрана — дохода не будет.</div>`}
        </div>

        <div class="panel">
          <h2>Отчёт хода</h2>
          <div class="report">${renderReport()}</div>
        </div>
      </div>
    </div>

    <footer>Данил · Юридический институт при Дале · общага №3 · ход ${turnNumber} из 90</footer>
  `;

  attachSliderHandlers();
}

function renderReport(){
  if(!S.log.length) return 'Семестр только начинается.';
  const entry = S.log[0];
  if(!entry.lines) return 'Ход события завершён.';
  const L = entry.lines;
  const sec = (title, arr)=> arr && arr.length ? `<div class="rep-title">${title}</div>${arr.join('\n')}` : '';
  return [
    sec('Заработок и расходы', L.money),
    sec('Стресс', L.stress),
    sec('Быт', L.food),
    sec('Хвосты', L.tails),
    sec('Отношения', L.trust),
    sec('Фон', L.flags)
  ].filter(Boolean).join('\n');
}

function statCard(label, value, pct, invert){
  return `<div class="stat">
    <div class="stat-label"><span>${label}</span></div>
    <div class="stat-value">${value}</div>
    <div class="bar"><i style="width:${clamp(pct,0,100)}%;background:${barColor(pct,invert)}"></i></div>
  </div>`;
}
function sliderRow(key,label,value){
  const eff = effectiveUnits(value).toFixed(1);
  return `<div class="slider-row">
    <div class="slider-head"><b>${label}: ${value}</b><span class="eff">эфф. отдача ≈ ${eff}</span></div>
    <input type="range" min="0" max="21" value="${value}" data-key="${key}" class="alloc-slider">
  </div>`;
}
function schemePill(id){
  const s = SCHEMES[id];
  return `<div class="pill tag-${s.cat} ${S.incomeScheme===id?'active':''}" onclick="setScheme('${id}')">${s.label}</div>`;
}
const CAT_LABELS = { legal:'Легальная', gray:'Серая зона', scam:'Скам', criminal:'Криминал (Владос)' };
function schemeGroups(){
  const groups = { legal:S.market.legal, gray:S.market.gray, scam:S.market.scam };
  if(S.vladosUnlocked) groups.criminal = ['vlados_deal'];
  return Object.keys(groups).map(cat=>{
    const ids = groups[cat];
    if(!ids.length) return '';
    return `<div class="scheme-group"><span class="scheme-group-label">${CAT_LABELS[cat]}</span><div class="sub-options">${ids.map(id=>schemePill(id)).join('')}</div></div>`;
  }).join('') || '<span style="color:var(--text-dim);font-size:.75rem">На рынке сейчас пусто — ждём ротации.</span>';
}
function npcCard(k){
  const val = S.relationSplit[k]||0;
  const trust = S.trust[k];
  const isFull = FULL_NODES.includes(k);
  return `<div class="npc ${isFull?'':'light'}">
    <div class="npc-name">${NPC_LABELS[k]} <span>${trust}</span></div>
    <div class="bar"><i style="width:${trust}%;background:${barColor(trust,false)}"></i></div>
    <input type="range" min="0" max="21" value="${val}" data-npc="${k}" class="npc-slider">
    <span class="lock">юнитов: ${val} · ${NPC_SUBLABEL[k]}</span>
  </div>`;
}
function shopItemCard(id){
  const item = SHOP_ITEMS[id];
  const owned = S.shop[id];
  const price = currentPrice(id);
  const dur = item.weeks>0 ? `${item.weeks} нед.` : (item.weeks===0 ? 'постоянно/разово' : '');
  return `<div class="shop-item ${owned?'owned':''}">
    <div class="name">${item.label}</div>
    <div class="cat">${item.cat}${item.upkeep?` · содержание ${fmt(item.upkeep)}₽/нед`:''}</div>
    <div class="eff">${item.stress?`−${item.stress} стресс`:''}${item.structuralEffect==='stress'?'структурно снижает стресс':''}${item.structuralEffect==='life'?'дешевле быт, ниже фон стресса':''}${item.incomeBoost?', чуть эффективнее заработок':''}${item.studyHelp?', −1 к приросту хвостов':''} ${dur?`(${dur})`:''}</div>
    ${owned
      ? `<button class="secondary" onclick="sellItem('${id}')">Продать за ${fmt(Math.round(owned.paid*(item.cat==='status'?0.5:0.4)/500)*500)}₽</button>`
      : `<button class="secondary" ${S.resources.money<price?'disabled':''} onclick="buyItem('${id}')">Купить за ${fmt(price)}₽</button>`}
  </div>`;
}
function modalHtml(m, isEventTurn){
  return `<div class="modal-backdrop"><div class="modal ${isEventTurn?'event-turn':''}">
    ${m.kicker?`<div class="kicker">${m.kicker}</div>`:''}
    <h3>${m.title}</h3>
    <p>${m.text}</p>
    <div class="choices">
      ${m.choices.map((c,i)=>`<button class="secondary" onclick="handleEventChoice(${i})">${c.label}</button>`).join('')}
    </div>
  </div></div>`;
}
function attachSliderHandlers(){
  document.querySelectorAll('.alloc-slider').forEach(el=>{
    el.addEventListener('input', e=> setAlloc(e.target.dataset.key, e.target.value));
  });
  document.querySelectorAll('.npc-slider').forEach(el=>{
    el.addEventListener('input', e=> setRelation(e.target.dataset.npc, e.target.value));
  });
}

/* ============ ФОНОВАЯ МУЗЫКА ============ */
function toggleMusic(){
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('bgm-toggle');
  if(!audio || !btn) return;
  if(audio.paused){
    audio.play().catch(()=>{});
    btn.classList.add('playing'); btn.textContent='❚❚';
  } else {
    audio.pause();
    btn.classList.remove('playing'); btn.textContent='♪';
  }
}
function startMusic(){
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('bgm-toggle');
  if(!audio || !btn || !audio.paused) return;
  // вызывается из обработчика клика («Начать семестр»/«Продолжить») — это пользовательский
  // жест, поэтому браузер не блокирует воспроизведение, в отличие от автозапуска на загрузке страницы
  audio.play().then(()=>{
    btn.classList.add('playing'); btn.textContent='❚❚';
  }).catch(()=>{});
}

render();
</script>
</body>
</html>
